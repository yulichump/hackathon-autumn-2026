# Быстрый старт: docker compose up --build
# PostgreSQL + бэкенд (миграции применяются автоматически). Фронтенд запускается отдельно: см. README.md.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: invoice
      POSTGRES_PASSWORD: invoice
      POSTGRES_DB: invoice_keeper
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoice -d invoice_keeper"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://invoice:invoice@db:5432/invoice_keeper
    ports:
      - "8000:8000"

volumes:
  pgdata:
